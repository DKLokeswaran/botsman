name: Windows installer

on:
  push:
    tags: ["windows-v*"]
  workflow_dispatch:
  # preview.yml calls this to build the preview app.
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
  # Which pull requests build is decided in the jobs below. Adding the `build-apps` label to a draft builds it
  # through builds-on-request.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push cancels an older build of the same branch. A build asked for with the label has its own group.
concurrency:
  group: windows-${{ github.ref }}-${{ inputs.preview && 'preview' || github.event.action == 'labeled' && 'request' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the pull request changes a file this build uses. Tests and Markdown files never go into the app.
  changes:
    name: Find the Windows changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          used="$(git diff --name-only HEAD^1 HEAD | grep -Ev '(^|/)test/|\.md$' | grep -E '^(apps/windows/|packages/(pc-ui|client-core|protocol|tokens)/|pnpm-lock\.yaml$|\.github/workflows/windows\.yml$|\.github/actions/setup/)' || true)"
          echo "build=$([ -n "$used" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "${used:-No file this build uses changed.}"

  installer:
    name: Build the installer
    needs: changes
    # On a pull request it builds when the change touches this app and the pull request is ready for review, or is a
    # draft with the `build-apps` label. A skipped build counts as passed, which lets through a draft, which can't
    # merge, and a change with nothing for this app. If finding the changes failed, it builds anyway. A pull request
    # from a fork never builds, because this takes the slowest runners and would run anyone's code.
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'build-apps'))))
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # A tag publishes a release and the update manifest, and a preview publishes to the `preview` release.
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the tag names the app's version
        if: startsWith(github.ref, 'refs/tags/windows-v') && !inputs.preview
        shell: bash
        run: |
          node scripts/release.ts check windows "$GITHUB_REF_NAME"
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "A release needs the update signing key"; exit 1; }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/src-tauri/target
          key: cargo-${{ hashFiles('apps/windows/src-tauri/Cargo.toml', 'apps/windows/src-tauri/Cargo.lock') }}
          restore-keys: cargo-
      # The preview app has its own app id, name, version, and update feed, set on this machine only. A preview started
      # from a release tag never runs that tag's release steps.
      - name: Make this the preview app
        if: inputs.preview
        shell: bash
        run: |
          version="$(node scripts/release.ts preview windows)"
          echo "Windows preview $version" >> "$GITHUB_STEP_SUMMARY"
      # Without the signing key, for example in a fork, it builds the installer without update files.
      - name: Build the installer
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm --filter @botsman/windows tauri build
          else
            pnpm --filter @botsman/windows tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: botsman-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*
            apps/windows/src-tauri/Cargo.lock
          retention-days: 7
          if-no-files-found: error
      # Installed apps read windows.json from the `updates` release to find this build.
      - name: Publish the release and its update manifest
        if: startsWith(github.ref, 'refs/tags/windows-v') && !inputs.preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#windows-v}"
          installer="apps/windows/src-tauri/target/release/bundle/nsis/Botsman_${version}_x64-setup.exe"
          gh release create "$GITHUB_REF_NAME" "$installer" "$installer.sig" --title "Windows $version" --generate-notes --latest=false
          node scripts/release.ts manifest windows "$GITHUB_REF_NAME" "$installer" "$installer.sig" > "$RUNNER_TEMP/windows.json"
          gh release view updates > /dev/null 2>&1 || gh release create updates --title "Update manifests" --notes "The files installed apps read to find newer builds. Nothing here is meant to be downloaded by hand." --latest=false
          gh release upload updates "$RUNNER_TEMP/windows.json" --clobber
      # Preview apps read windows.json from the `preview` release. Without the signing key, the installer stays a
      # workflow artifact to install by hand.
      - name: Publish the preview and its update manifest
        if: inputs.preview && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest installer is this build's; the cached target folder can hold older ones.
          built="$(ls -t apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)"
          installer="$RUNNER_TEMP/botsman-preview-setup.exe"
          cp "$built" "$installer"
          cp "$built.sig" "$installer.sig"
          node scripts/release.ts manifest windows preview "$installer" "$installer.sig" > "$RUNNER_TEMP/windows.json"
          gh release view preview > /dev/null 2>&1 || gh release create preview --prerelease --latest=false --title "Preview builds" --notes "Test builds from the preview workflow. Only the Botsman Preview apps read these files." || gh release view preview > /dev/null
          gh release upload preview "$installer" "$installer.sig" "$RUNNER_TEMP/windows.json" --clobber
