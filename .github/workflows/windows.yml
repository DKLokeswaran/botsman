name: Windows installer

on:
  push:
    tags: ["windows-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - apps/windows/**
      - packages/pc-ui/**
      - packages/client-core/**
      - packages/protocol/**
      - packages/tokens/**
      - pnpm-lock.yaml
      - .github/workflows/windows.yml
      - .github/actions/setup/**

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Build the installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows/src-tauri/target
          key: cargo-${{ hashFiles('apps/windows/src-tauri/Cargo.toml', 'apps/windows/src-tauri/Cargo.lock') }}
          restore-keys: cargo-
      # A pull request from a fork has no signing key, so it builds the installer without update files.
      - name: Build the installer
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm --filter @botsman/windows tauri build
          else
            pnpm --filter @botsman/windows tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: botsman-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*
            apps/windows/src-tauri/Cargo.lock
          retention-days: 7
          if-no-files-found: error
