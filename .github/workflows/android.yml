name: Android APK

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
  # preview.yml calls this to build the preview app.
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/android/**
      - packages/client-core/**
      - packages/protocol/**
      - packages/tokens/**
      - pnpm-lock.yaml
      - .github/workflows/android.yml
      - .github/actions/setup/**

concurrency:
  group: android-${{ github.ref }}-${{ inputs.preview && 'preview' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build the APK
    # A pull request from a fork runs the checks in ci.yml, but not this build.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # A tag publishes a release and the update manifest, and a preview publishes to the `preview` release.
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the tag names the app's version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          node scripts/release.ts check android "$GITHUB_REF_NAME"
          test -n "$KEYSTORE_BASE64" || { echo "A release needs the signing keystore"; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-
      # The preview app has its own app id, name, version, and update feed, set on this machine only.
      - name: Make this the preview app
        if: inputs.preview
        run: |
          version="$(node scripts/release.ts preview android)"
          echo "Android preview $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate the Android project
        run: pnpm --filter @botsman/android prebuild
      # A pull request from a fork has no keystore, so its APK keeps the debug signature.
      - name: Build the APK for arm64 phones
        working-directory: apps/android/android
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            signing=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.p12"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD"
            )
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a "${signing[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: botsman-android
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
      # Installed apps read android.json from the `updates` release to find this build.
      - name: Publish the release and its update manifest
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          apk="$RUNNER_TEMP/botsman-$version.apk"
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Android $version" --generate-notes --latest=false
          node scripts/release.ts manifest android "$GITHUB_REF_NAME" "$apk" > "$RUNNER_TEMP/android.json"
          gh release view updates > /dev/null 2>&1 || gh release create updates --title "Update manifests" --notes "The files installed apps read to find newer builds. Nothing here is meant to be downloaded by hand." --latest=false
          gh release upload updates "$RUNNER_TEMP/android.json" --clobber
      # Preview apps read android.json from the `preview` release. Without the keystore, the APK stays a workflow
      # artifact to install by hand.
      - name: Publish the preview and its update manifest
        if: inputs.preview && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/botsman-preview.apk"
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk "$apk"
          node scripts/release.ts manifest android preview "$apk" > "$RUNNER_TEMP/android.json"
          gh release view preview > /dev/null 2>&1 || gh release create preview --prerelease --latest=false --title "Preview builds" --notes "Test builds from the preview workflow. Only the Botsman Preview apps read these files." || gh release view preview > /dev/null
          gh release upload preview "$apk" "$RUNNER_TEMP/android.json" --clobber
