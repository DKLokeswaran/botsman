name: phase0

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/**"
      - "contract/**"
      - "tokens/**"
      - "notifier/**"
      - "docs/**"
      - ".github/workflows/phase0.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "contract/**"
      - "tokens/**"
      - "notifier/**"
      - "docs/**"
      - ".github/workflows/phase0.yml"

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            contract/ts/package-lock.json
            apps/windows/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - name: Contract, tokens, notifier, Windows typecheck
        run: |
          python3 contract/check_contract.py
          python3 tokens/build_tokens.py --check
          python3 -m unittest tokens/test_regressions.py
          python3 notifier/test_notify.py
          npm ci --prefix contract/ts
          npm test --prefix contract/ts
          npx --prefix contract/ts tsc -p contract/ts --noEmit
          npm ci --prefix apps/windows
          npm run check --prefix apps/windows
          npm test --prefix apps/windows
      - name: Windows browser end-to-end
        working-directory: apps/windows
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload Playwright report
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: hermes-bots-e2e
          path: |
            apps/windows/e2e/playwright-report/
            apps/windows/e2e/test-results/
          if-no-files-found: error
      - name: Kotlin client tests and debug APK
        working-directory: apps/android
        run: chmod +x ./gradlew && ./gradlew :hermes-client:test :app:testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-bots-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-bots-android-screenshots
          path: apps/android/app/build/outputs/roborazzi/*.png
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - name: Frontend dependencies
        working-directory: apps/windows
        run: npm ci
      - name: Stamp installer version
        run: node scripts/stamp_version.mjs
      - name: NSIS installer
        working-directory: apps/windows
        run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: hermes-bots-windows-setup
          path: apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
